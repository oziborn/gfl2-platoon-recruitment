  <script>
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'absolute w-1.5 h-1.5 bg-orange-400 rounded-full animate-float';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 2 + 's';
      particle.style.animationDuration = (3 + Math.random() * 2) + 's';
      particlesContainer.appendChild(particle);
    }

    const observerOptions = {
      threshold: 0.3,
      rootMargin: '0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.remove('opacity-0', 'scale-90');
          entry.target.classList.add('opacity-100', 'scale-100');

          const children = entry.target.querySelectorAll('.opacity-0');
          children.forEach((el) => {
            el.classList.remove('opacity-0', 'translate-y-8', 'translate-y-10', 'translate-y-12', '-translate-x-8', '-translate-x-12', 'translate-x-12', 'translate-y-5', 'scale-50');
            el.classList.add('opacity-100', 'translate-y-0', 'translate-x-0', 'scale-100');
          });
        }
      });
    }, observerOptions);

    document.querySelectorAll('section').forEach(section => {
      observer.observe(section);
    });

    let ticking = false;
    const section1 = document.getElementById('section-1');

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          const scrollProgress = window.pageYOffset / window.innerHeight;

          if (scrollProgress <= 0.2) {
            const opacity = 1 - (scrollProgress / 0.2);
            section1.style.opacity = opacity;
            section1.style.transform = `scale(${1 - (scrollProgress / 0.2) * 0.2})`;
          }

          ticking = false;
        });
        ticking = true;
      }
    });

  </script>
